[workspace]
authors = ["GenAI2OpenAI contributors"]
channels = ["conda-forge"]
name = "genai2openai"
version = "2.2.0"
description = "Convert ShanghaiTech GenAI API to OpenAI compatible API"
platforms = ["linux-64"]
readme = "README.md"

[tasks]
serve = "python main.py"
test = "pytest"
context-probe = "python tools/context_probe.py"
bench-speed = "python tools/bench_speed.py"

[dependencies]
python = "3.11.*"

[pypi-dependencies]
flask = ">=3.1.2"
flask-cors = ">=4.0.0"
pycryptodome = ">=3.20.0"
requests = ">=2.32.5"
python-dotenv = ">=1.0.0"

[feature.dev.pypi-dependencies]
pytest = ">=8.0.0"

[environments]
default = { features = ["dev"] }
